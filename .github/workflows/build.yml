name: build

on:
  push:
    branches: [main]
    paths: &build-paths
      - 'src/**'
      - 'tests/**'
      - 'webui/**'
      - '*.slnx'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths: *build-paths

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: setup dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: dotnet build
        run: dotnet build nekostick-svchost.slnx -c Release
      - name: dotnet test
        run: dotnet test nekostick-svchost.slnx -c Release --no-build

      # Extension layout: manifest.json + all dlls (extension + Contracts + YamlDotNet).
      - name: pack extension
        shell: bash
        run: |
          set -euo pipefail
          out="src/Nekolla.Nekostick.ServiceHost/bin/Release/net10.0"
          mkdir -p dist/nekostick-svchost
          cp "$out"/*.dll "$out/manifest.json" dist/nekostick-svchost/
          sha="$(git rev-parse --short HEAD)"
          (cd dist/nekostick-svchost && zip -r "../nekostick-svchost.$sha.zip" .)

      - name: upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: dist/nekostick-svchost.*.zip
          archive: false
          if-no-files-found: error
